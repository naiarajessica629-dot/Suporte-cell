name: Build APK Android

on:
  push:
    paths:
      - 'app-android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar projeto Android e compilar APK
        working-directory: app-android
        run: |
          set -o pipefail
          {
            set -e
            flutter --version
            # Guarda nossos fontes
            cp pubspec.yaml /tmp/pubspec.yaml
            cp lib/main.dart /tmp/main.dart
            # Gera a estrutura Android (gradle, MainActivity, recursos)
            flutter create --platforms=android --org com.superfrio --project-name suporte_cell .
            # Restaura nossos fontes e aplica o manifesto com permissões
            cp /tmp/pubspec.yaml pubspec.yaml
            cp /tmp/main.dart lib/main.dart
            cp android_manifest.xml android/app/src/main/AndroidManifest.xml
            # minSdk 23 (flutter_webrtc) e targetSdk 33 (sideload). Cobre Kotlin DSL e Groovy.
            for f in android/app/build.gradle.kts android/app/build.gradle; do
              [ -f "$f" ] || continue
              sed -i -E 's/minSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.minSdkVersion/minSdk = 23/' "$f"
              sed -i -E 's/targetSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.targetSdkVersion/targetSdk = 33/' "$f"
            done
            echo "===== build.gradle(.kts) defaultConfig ====="
            grep -nE 'minSdk|targetSdk|compileSdk' android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || true
            flutter pub get
            flutter build apk --release
          } 2>&1 | tee build.log

      - name: Diagnóstico em caso de falha
        if: failure()
        working-directory: app-android
        run: |
          echo "::group::Fim do log"
          tail -n 80 build.log || echo "sem build.log"
          echo "::endgroup::"
          # Publica as últimas linhas como anotações (legíveis pela API)
          if [ -f build.log ]; then
            grep -nE "error|Error|ERROR|FAILURE|Exception|what went wrong|Could not|not found|minSdk|Unsupported|incompatible" build.log | tail -n 20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: suporte-cell-apk
          path: app-android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
