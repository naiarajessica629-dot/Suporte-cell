name: Build APK Android

on:
  push:
    paths:
      - 'app-android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Gerar projeto Android e compilar APK
        working-directory: app-android
        run: |
          set -o pipefail
          {
            set -e
            flutter --version
            # Guarda nossos fontes
            cp pubspec.yaml /tmp/pubspec.yaml
            cp lib/main.dart /tmp/main.dart
            # Gera a estrutura Android (gradle, MainActivity, recursos)
            flutter create --platforms=android --org com.superfrio --project-name suporte_cell .
            # Restaura nossos fontes e aplica o manifesto com permissões
            cp /tmp/pubspec.yaml pubspec.yaml
            cp /tmp/main.dart lib/main.dart
            cp android_manifest.xml android/app/src/main/AndroidManifest.xml
            # MainActivity com deep link (abre o app pelo link do atendente)
            mkdir -p android/app/src/main/kotlin/com/superfrio/suporte_cell
            cp MainActivity.kt android/app/src/main/kotlin/com/superfrio/suporte_cell/MainActivity.kt
            # Assinatura fixa (resolve "app não instalado" ao atualizar por cima)
            cp suporte.jks android/app/suporte.jks
            # minSdk 24 (plugins) e targetSdk 33 (sideload). Substitui o token direto — Kotlin DSL e Groovy.
            for f in android/app/build.gradle.kts android/app/build.gradle; do
              [ -f "$f" ] || continue
              sed -i 's/flutter\.minSdkVersion/24/g' "$f"
              sed -i 's/flutter\.targetSdkVersion/33/g' "$f"
            done
            # Aplica a assinatura fixa no build de release (Groovy ou Kotlin DSL)
            python3 sign_patch.py
            flutter pub get
            flutter build apk --release
          } 2>&1 | tee build.log

      - name: Diagnóstico em caso de falha
        if: failure()
        working-directory: app-android
        run: |
          echo "::group::Fim do log"
          tail -n 80 build.log || echo "sem build.log"
          echo "::endgroup::"
          # Publica as últimas linhas como anotações (legíveis pela API)
          if [ -f build.log ]; then
            grep -nE "requires a higher|Android SDK version|BUILD FAILED|FAILURE:|What went wrong|Caused by|A problem occurred|Execution failed|Could not|not found|Unsupported|incompatible|error:|> " build.log | tail -n 25 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: suporte-cell-apk
          path: app-android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publicar APK em release (link de download direto)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app-android/build/app/outputs/flutter-apk/app-release.apk suporte-cell.apk
          gh release create apk-latest --title "Suporte Cell — APK" \
            --notes "APK do app cliente (Android). Baixe suporte-cell.apk e instale no celular." \
            || echo "release já existe"
          gh release upload apk-latest suporte-cell.apk --clobber
