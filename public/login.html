<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar — Suporte Remoto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;650;700&display=swap">
<link rel="stylesheet" href="/estilo.css">
<style>
  .loginwrap { min-height: 100%; display: grid; place-items: center; padding: 24px; }
  .loginbox { width: 100%; max-width: 380px; }
  .loginhead { text-align: center; margin-bottom: 22px; }
  .loginhead .mark { width: 46px; height: 46px; border-radius: 12px; margin: 0 auto 14px; }
  .loginhead .mark svg { width: 24px; height: 24px; }
  .loginhead h1 { font-size: 21px; }
  .loginhead p { color: var(--ink-soft); font-size: 13px; margin-top: 4px; }
  .err { background: #2c1414; border: 1px solid #5a2222; color: #f1a6a6; border-radius: 9px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="loginwrap">
  <div class="loginbox">
    <div class="loginhead">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></span>
      <h1>Suporte Remoto</h1>
      <p>Acesso do atendente</p>
    </div>
    <div class="card">
      <div class="body">
        <div class="err" id="err" hidden></div>
        <form id="form">
          <div class="field">
            <label for="user">Usuário</label>
            <input id="user" type="text" autocomplete="username" autofocus>
          </div>
          <div class="field">
            <label for="pass">Senha</label>
            <input id="pass" type="password" autocomplete="current-password">
          </div>
          <button class="btn" id="btn" type="submit">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
  var form = document.getElementById("form");
  var err = document.getElementById("err");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    err.hidden = true;
    var btn = document.getElementById("btn");
    btn.disabled = true; btn.textContent = "Entrando…";
    fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user: document.getElementById("user").value, pass: document.getElementById("pass").value }),
    }).then(function (r) {
      if (r.ok) { location.href = "/"; return; }
      return r.json().then(function (d) {
        err.textContent = (d && d.error) || "Falha ao entrar"; err.hidden = false;
        btn.disabled = false; btn.textContent = "Entrar";
      });
    }).catch(function () {
      err.textContent = "Erro de conexão. Tente de novo."; err.hidden = false;
      btn.disabled = false; btn.textContent = "Entrar";
    });
  });
</script>
</body>
</html>
